# I used ChatGPT to make this since iam not good at making GitHub Actions YAML
name: Package Desktop GIFs

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release ZIPs
        run: python tools/package.py

      - name: Upload ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: desktop-gifs-release-zips
          path: dist/*.zip
